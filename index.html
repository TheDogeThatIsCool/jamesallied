<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Branch Supply Order - Paper Note Rolls</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

.container {
    max-width: 700px;
    margin: 40px auto;
    background: #1c1c1c;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(0,0,0,0.6);
}

h1 {
    text-align: center;
    color: #4da6ff;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input, select, textarea {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 5px;
    border: none;
    font-size: 14px;
}

textarea {
    resize: vertical;
    min-height: 80px;
}

button {
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    background: #4da6ff;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #3385ff;
}

.notice {
    margin-top: 20px;
    font-size: 13px;
    color: #aaa;
    text-align: center;
}
</style>
</head>

<body>

<div class="container">
    <h1>Paper Note Roll Request</h1>

    <form action="#" method="POST">
        
        <label>Branch Name</label>
        <input type="text" name="branch_name" required>

        <label>Branch ID</label>
        <input type="text" name="branch_id" required>

        <label>Manager Name</label>
        <input type="text" name="manager_name" required>

        <label>Delivery Address</label>
        <textarea name="address" required></textarea>

        <label>Quantity of Paper Note Rolls</label>
        <select name="quantity" required>
            <option value="">Select Quantity</option>
            <option value="10">10 Rolls</option>
            <option value="25">25 Rolls</option>
            <option value="50">50 Rolls</option>
            <option value="100">100 Rolls</option>
            <option value="250">250 Rolls</option>
        </select>

        <label>Storage Purpose / Notes (Optional)</label>
        <textarea name="notes"></textarea>

        <button type="submit">Submit Supply Request</button>

    </form>

    <div class="notice">
        All paper note rolls are supplied at no cost to branch locations for official storage use only.
        Orders are reviewed by central supply management before dispatch.
    </div>
</div>

</body>
</html>
